make_beverage:
  name: Prepare beverage
  description: Prepares beverages from the list of available beverages
  target:
    entity:
      domain: select
      # supported_features:
      #   - delonghi_primadonna.BeverageEntityFeature.MAKE_BEVERAGE
  fields:
    entity_id:
      description: "DeLonghi select entity ID"
      example: "select.primadonna_make_beverage"
    beverage:
      name: Beverage
      description: Beverage to prepare
      required: true
      default: "none"
      example: "long"
      selector:
        select:
          translation_key: "beverage"
          options:
            - "none"
            - "steam"
            - "long"
            - "coffee"
            - "dopio"
            - "hot_water"
            - "espresso"
            - "americano"
            - "espresso2"

send_raw_command:
  name: Send raw command
  description: >-
    Send a hand-written packet to the machine, for protocol work. The
    checksum is appended automatically, so leave it off - but the length
    byte must already account for it. Replies appear in the debug log.
  fields:
    command:
      name: Command
      description: "Packet as hex, without checksum"
      required: true
      example: "0d 05 a9 f0"
      selector:
        text:
